name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradeai
          POSTGRES_PASSWORD: tradeai
          POSTGRES_DB: tradeai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tradeai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://tradeai:tradeai@localhost:5432/tradeai_test
      DATABASE_URL: postgresql+asyncpg://tradeai:tradeai@localhost:5432/tradeai_test
      REDIS_URL: redis://localhost:6379/0
      VECTOR_DB_URL: http://localhost:6333
      JWT_SECRET_KEY: change-me-in-production-must-be-at-least-32-bytes

    defaults:
      run:
        working-directory: backend
