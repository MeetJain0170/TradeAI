[project]
name = "tradeai-backend"
version = "0.1.0"
description = "TradeAI backend — enterprise AI-native trading platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "bcrypt>=4.0.0",
    "celery[redis]>=5.4.0",
    "email-validator>=2.3.0",
    "fastapi>=0.115.0",
    "greenlet>=3.0.0",
    "pandas>=2.2.0",
    "pydantic-settings>=2.0",
    "pyjwt>=2.8.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.32.0",
    "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "httpx2>=0.28.0",
    "mypy>=1.14.0",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["app", "config", "tests"]

[tool.ruff.lint]
ignore = ["UP046"]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "config"]
exclude = ["^external/"]
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
